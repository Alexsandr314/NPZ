<div class="col-md-6 col-lg-4 mb-4">
    <div class="card h-100 shadow-sm border-0 order-card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h5 class="card-title fw-bold text-primary mb-0">{{ order.customer_name }}</h5>
                <span class="badge bg-light text-dark border">ID: {{ order.id }}</span>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between small text-muted">
                    <span>Продукт:</span>
                    <span class="fw-bold text-dark">{{ order.product_name }}</span>
                </div>
                <div class="d-flex justify-content-between small text-muted">
                    <span>Необходимый объем:</span>
                    <span class="fw-bold text-dark">{{ order.required_quantity }} т.</span>
                </div>
            </div>

            <div class="bg-light p-3 rounded mb-3 text-center">
                <span class="text-muted small d-block">Сумма контракта:</span>
                <h3 class="text-success fw-bold mb-0">${{ order.reward_price|floatformat:2 }}</h3>
            </div>

            <p class="small mb-3">
                <i class="bi bi-clock-history"></i> Срок:
                <span class="deadline-urgent">{{ order.deadline|date:"d.m.Y H:i" }}</span>
            </p>

            <form action="{% url 'fulfill_order' order.id %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm">
                    ✅ Выполнить и выдать чек
                </button>
            </form>
        </div>
    </div>
</div>
